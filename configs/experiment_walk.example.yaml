# Example only. Adjust values during implementation.

experiment:
  id: exp_walk_001
  run_id: run_local_001
  robot_id: humanoid_sim_01
  duration_sec: 30
  frequency_hz: 30
  random_seed: 42

robot:
  mass_kg: 60
  base_height_m: 0.94

motion:
  mode: walk
  target_velocity:
    vx: 0.5
    vy: 0.0
    yaw_rate: 0.05
  gait_frequency_hz: 1.2
  lateral_sway_m: 0.03
  vertical_bob_m: 0.025
  roll_factor_std: 0.07
  pitch_factor_std: 0.08

streaming:
  protocol: websocket_or_http_or_udp

logging:
  format: jsonl
  output_path: logs/exp_walk_001/run_local_001.jsonl

noise:
  joint_position_std: 0.01
  imu_accel_std: 0.03
  gyro_std: 0.005
  latency_std_ms: 5
  foot_force_std_n: 15

anomalies:
  enabled: true
  latency_spike_probability: 0.01
  packet_drop_probability: 0.005
